name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Lamdera setup
        uses: ./.github/actions/lamdera-setup
        with:
          cli-auth: ${{ secrets.LAMDERA_CLI_AUTH }}

      - name: Verify Lamdera on PATH
        run: lamdera --version

      - name: Run elm-review
        run: npm run review

      - name: Run tests
        run: npm test

      # CI version of .githooks/pre-push: a persisted type changed since the
      # last production deploy and no Evergreen migration is committed → fail
      # the PR now rather than the deploy later. `--force` runs the real
      # production check off main (see .claude/skills/lamdera-deploy).
      # Skipped when the secret isn't available (forks).
      - name: Evergreen check (lamdera check)
        if: github.event_name == 'pull_request'
        env:
          HAS_AUTH: ${{ secrets.LAMDERA_CLI_AUTH != '' }}
        run: |
          if [ "$HAS_AUTH" != "true" ]; then
            echo "::warning::LAMDERA_CLI_AUTH secret not set; skipping lamdera check"
            exit 0
          fi
          status=0
          lamdera check --force </dev/null || status=$?
          if [ -n "$(git status --porcelain -- src/Evergreen)" ]; then
            git status --short -- src/Evergreen
            echo "::error::lamdera check generated Evergreen files: types changed vs production but no migration is committed. Run 'lamdera check --force', finish src/Evergreen/Migrate/V<N>.elm, and commit src/Evergreen (see .claude/skills/lamdera-deploy/SKILL.md)."
            exit 1
          fi
          exit $status
