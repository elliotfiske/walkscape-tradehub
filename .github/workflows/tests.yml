name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Org policy: no GitHub-hosted runners.
    runs-on: prod-arc-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      # Pinned to the exact Lamdera version that locked this repo's elm.json.
      # The rolling /bin/linux/lamdera ("latest") can drift to a version with
      # different vendored package versions, which fails the compile below with
      # "INCOMPATIBLE DEPENDENCIES". Bump this in lockstep with local upgrades.
      # Lamdera ships no published checksum/signature, so this is a
      # trust-on-first-use pin: LAMDERA_SHA256 was captured from the binary
      # over HTTPS and verified across independent fetches. CI aborts before
      # chmod/exec if the download doesn't match, defeating a poisoned DNS,
      # MITM, or compromised-CDN swap. Update BOTH version and hash in lockstep
      # on upgrade: curl the new URL and run `sha256sum` to get the new value.
      - name: Install Lamdera compiler
        env:
          LAMDERA_VERSION: "1.4.0"
          LAMDERA_SHA256: "6287d0853237a806be73d43212a2ed839bd697f2b1b9466a8d135eae438575c4"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://static.lamdera.com/bin/lamdera-${LAMDERA_VERSION}-linux-x86_64" -o "$HOME/.local/bin/lamdera"
          echo "${LAMDERA_SHA256}  $HOME/.local/bin/lamdera" | sha256sum -c -
          chmod a+x "$HOME/.local/bin/lamdera"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Lamdera on PATH
        run: lamdera --version

      - name: Install npm dependencies
        run: npm ci

      # Populate ELM_HOME with Lamdera's vendored packages (lamdera/core, etc.).
      # elm-test-rs's dependency solver reads the package cache/registry, and
      # those packages aren't on the public Elm registry — so without a prior
      # compile it fails with "no version of lamdera/core in 1.0.0".
      - name: Prime Elm package cache
        run: lamdera make src/Frontend.elm src/Backend.elm --output=/dev/null

      - name: Run elm-review
        run: npm run review

      - name: Run tests
        run: npm test
